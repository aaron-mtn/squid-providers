[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squid-providers"
version = "0.1.0"
description = "First-party model transports for Squid Core"
requires-python = ">=3.11"
dependencies = ["squid-core==0.1.0", "openai", "httpx"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = ["squid_providers", "squid_providers.*"]
