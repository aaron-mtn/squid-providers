[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "squid-providers"
version = "0.1.1"
description = "First-party model transports, configuration, and discovery for Squid Core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aaron Slater"}]
requires-python = ">=3.11"
dependencies = ["squid-core==0.1.0", "openai", "httpx"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = ["squid_providers", "squid_providers.*"]
